name: Daily static site and preview refresh

# Rebuild HTML and OG together so crawler snapshots and the OG version agree.
# This refresh does not fetch or silently update source estimates.

on:
  schedule:
    # Retain the existing daily refresh schedule.
    - cron: "5 0 * * *"
  # Allow manual runs from the Actions tab for testing and one-off refreshes.
  workflow_dispatch:

# Serialize manual and scheduled deployments.
concurrency:
  group: og-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-og:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate data and calculations
        run: npm test

      - name: Build HTML and Open Graph image
        run: npm run build

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Trust droplet host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 46.101.216.23 >> ~/.ssh/known_hosts

      - name: Publish verified static release
        run: bash scripts/deploy.sh root@46.101.216.23
